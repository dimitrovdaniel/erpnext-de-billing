[project]
name = "de_billing"
authors = [{ name = "Daniel Dimitrov", email = "daniel@codebydaniel.net" }]
description = "German invoicing for ERPNext: SKR03 setup, down-payment and final invoices, reverse charge, REST API and signed webhooks"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191", "E101", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
